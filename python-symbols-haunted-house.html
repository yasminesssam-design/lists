<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيت الرموز المسكون 👻 | رموز بايثون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0D0620; --bg2:#1A0B2E; --bg3:#241243;
    --purple:#9D4EDD; --purple-deep:#5A189A;
    --green:#39FF14; --green-soft:#5CE65C;
    --orange:#FF7518; --yellow:#FFD23F;
    --pink:#FF3EA5;
    --paper:#FFF8EE;
    --ink:#241243;
    --code-bg:#120826; --code-text:#EDE6FF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Cairo', sans-serif; color:var(--ink);
    background:
      radial-gradient(ellipse at 15% 0%, rgba(157,78,221,.35) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(255,117,24,.18) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 100%, rgba(57,255,20,.10) 0%, transparent 50%),
      linear-gradient(180deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    height:100vh; overflow:hidden;
  }
  h1,h2,h3,.display{ font-family:'Baloo Bhaijaan 2', sans-serif; }

  .bgfx{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .moon{ position:fixed; top:26px; left:26px; font-size:64px; z-index:0; filter:drop-shadow(0 0 26px #FFEB99);
    animation: moonGlow 4.5s ease-in-out infinite; pointer-events:none;}
  @keyframes moonGlow{ 0%,100%{opacity:.8; transform:scale(1);} 50%{opacity:1; transform:scale(1.05);} }
  .ghost{ position:fixed; font-size:46px; opacity:.55; z-index:0; pointer-events:none; filter:drop-shadow(0 0 10px rgba(157,78,221,.6)); }
  .ghost.g1{ top:14%; left:8%; animation: floatGhost1 7s ease-in-out infinite; }
  .ghost.g2{ top:60%; left:85%; animation: floatGhost2 8.5s ease-in-out infinite; font-size:38px; }
  .ghost.g3{ top:78%; left:6%; animation: floatGhost1 6.2s ease-in-out infinite reverse; font-size:32px; opacity:.4;}
  @keyframes floatGhost1{ 0%,100%{transform:translate(0,0) rotate(0deg);} 50%{transform:translate(24px,-26px) rotate(6deg);} }
  @keyframes floatGhost2{ 0%,100%{transform:translate(0,0) rotate(0deg);} 50%{transform:translate(-22px,-20px) rotate(-8deg);} }
  .bat{ position:fixed; font-size:26px; z-index:0; pointer-events:none; opacity:.75; animation: flyBat 13s linear infinite; }
  .bat.b2{ animation-duration:17s; animation-delay:3s; font-size:20px; top:6%; }
  @keyframes flyBat{
    0%{ left:-8%; top:16%; transform:translateY(0) scaleX(1);}
    25%{ top:8%; transform:translateY(-10px) scaleX(1);}
    50%{ left:55%; top:22%; transform:translateY(0) scaleX(-1);}
    75%{ top:12%; transform:translateY(-8px) scaleX(-1);}
    100%{ left:112%; top:18%; transform:translateY(0) scaleX(1);}
  }
  .spider{ position:fixed; top:0; font-size:30px; z-index:5; pointer-events:none; opacity:.85; }
  .spider::before{ content:""; position:absolute; top:-999px; left:50%; width:1px; height:1200px; background:rgba(255,255,255,.25); }
  .spider.s1{ left:12%; animation: dangle 3.6s ease-in-out infinite; }
  .spider.s2{ left:92%; animation: dangle 4.3s ease-in-out infinite; animation-delay:1s; font-size:22px; }
  @keyframes dangle{ 0%,100%{ top:0px;} 50%{ top:38px;} }
  .star{ position:fixed; z-index:0; color:#fff; pointer-events:none; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }
  .fog{ position:fixed; left:-20%; right:-20%; bottom:-40px; height:160px; z-index:1; pointer-events:none;
    background: linear-gradient(180deg, transparent, rgba(157,78,221,.18) 40%, rgba(36,18,67,.4));
    filter:blur(10px); animation: fogDrift 18s ease-in-out infinite; }
  @keyframes fogDrift{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(4%);} }

  #deck{ position:relative; height:100vh; width:100vw; z-index:2; }
  .slide{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:70px 24px 100px; overflow-y:auto; }
  .slide.active{ display:flex; animation: slideIn .5s ease; }
  @keyframes slideIn{ from{opacity:0; transform:translateY(18px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }

  .panel{
    background: linear-gradient(180deg, #FFFDF7, var(--paper));
    border-radius:26px; padding:32px 38px; max-width:760px; width:100%;
    box-shadow: 0 0 0 3px rgba(157,78,221,.5), 0 30px 70px -25px rgba(0,0,0,.7), 0 0 60px -10px rgba(57,255,20,.15);
    position:relative; z-index:3; max-height:78vh; overflow-y:auto;
    border: 2px dashed rgba(157,78,221,.35);
  }
  .panel::before{ content:"🕸️"; position:absolute; top:-14px; right:-10px; font-size:34px; transform:rotate(15deg); opacity:.9;}
  .panel::after{ content:"🕸️"; position:absolute; bottom:-16px; left:-10px; font-size:30px; transform:scaleX(-1) rotate(10deg); opacity:.8;}

  .eyebrow{ display:inline-flex; align-items:center; gap:8px; background:var(--purple-deep); color:#fff; font-weight:800;
    font-family:'Baloo Bhaijaan 2'; font-size:13px; padding:6px 18px; border-radius:999px; margin-bottom:14px; }
  .eyebrow.quiz{ background:var(--pink); }
  .eyebrow.cover{ background:var(--orange); color:#2A0E5C; }
  h2.slide-title{ font-size:clamp(22px,4vw,29px); color:var(--purple-deep); margin:0 0 14px; }
  p.lead{ font-size:16.5px; line-height:2; margin:8px 0; }
  .highlight{ background:linear-gradient(180deg, transparent 60%, #E7D3FF 60%); font-weight:700; padding:0 2px;}

  .code-box{ background:var(--code-bg); color:var(--code-text); border-radius:16px; padding:18px 20px;
    font-family:'Fira Code', monospace; font-size:14.5px; line-height:1.85; direction:ltr; text-align:left;
    white-space:pre; overflow-x:auto; margin:14px 0; position:relative; border:1px solid rgba(157,78,221,.4); }
  .code-box::before{ content:"👻 ● ● ●"; position:absolute; top:10px; left:14px; color:#6C5E9E; font-size:11px; letter-spacing:3px;}
  .code-box .cbody{ display:block; margin-top:20px; }
  .kw{ color:#FF7518; font-weight:600;} .fn{ color:#39FF14;} .str{ color:#FFD23F;} .cm{ color:#9186BD;} .num{color:#FF3EA5;}

  .result-chip{ display:inline-flex; align-items:center; gap:8px; background:#EDE0FF; color:#5A189A; font-weight:700;
    padding:8px 16px; border-radius:12px; margin-top:6px; font-size:14px; }
  .tip-row{ display:flex; gap:10px; align-items:flex-start; background:#F5F0FF; border:2px dashed #C9A6FF; border-radius:14px; padding:12px 14px; margin-top:12px; font-size:14.5px; }
  .tip-row .dot{ font-size:20px; }
  .symbol-badge{ display:inline-flex; align-items:center; justify-content:center; font-family:'Fira Code'; font-weight:700;
    background:var(--purple-deep); color:#fff; width:44px; height:44px; border-radius:12px; font-size:20px; margin-left:10px; }

  .cover-emoji{ font-size:70px; text-align:center; animation:bob 2.2s ease-in-out infinite; margin-bottom:6px;}
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-14px) rotate(-6deg);} }
  .start-btn{ margin-top:18px; background:linear-gradient(135deg, var(--purple), var(--purple-deep)); color:#fff; border:none;
    font-family:'Baloo Bhaijaan 2'; font-weight:800; font-size:18px; padding:14px 40px; border-radius:999px; cursor:pointer;
    box-shadow:0 8px 0 #3C0A6E; }
  .start-btn:active{ transform:translateY(4px); box-shadow:0 4px 0 #3C0A6E; }

  .q-code{ background:var(--code-bg); color:var(--code-text); border-radius:14px; padding:16px; font-family:'Fira Code', monospace;
    font-size:14px; line-height:1.75; direction:ltr; text-align:left; white-space:pre-wrap; margin-bottom:14px; border:1px solid rgba(157,78,221,.4); }
  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:560px){ .options{ grid-template-columns:1fr; } }
  .opt-btn{ font-family:'Cairo', sans-serif; text-align:right; background:#F5F0FF; border:2px solid #D8BFFF; border-radius:12px;
    padding:12px 14px; cursor:pointer; font-size:14.5px; color:var(--ink); transition:all .15s ease; }
  .opt-btn:hover:not(:disabled){ background:#E9DBFF; transform:translateY(-2px); }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.correct{ background:#DFF7E7 !important; border-color:#22C55E !important; color:#0F7A3D; font-weight:700; animation:pop .35s ease; }
  .opt-btn.wrong{ background:#FFE1EB !important; border-color:var(--pink) !important; color:#B8235A; animation:shake .4s ease; }
  .opt-btn.dim{ opacity:.4; }
  @keyframes pop{ 0%{transform:scale(1);} 50%{transform:scale(1.06);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-7px);} 75%{transform:translateX(7px);} }

  .feedback{ margin-top:12px; font-size:14.5px; border-radius:12px; padding:12px 14px; display:none; line-height:1.8; }
  .feedback.show{ display:block; animation:fadeIn .3s ease; }
  .feedback.ok{ background:#EAFBF0; color:#0F7A3D; border:2px solid #B7EFC8; }
  .feedback.bad{ background:#FFF0F4; color:#B8235A; border:2px solid #FFC9DA; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }

  .quiz-hud{ display:flex; gap:10px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
  .hud-pill{ background:var(--purple-deep); color:#fff; font-family:'Baloo Bhaijaan 2'; font-weight:700; font-size:14px;
    padding:8px 18px; border-radius:999px; display:flex; align-items:center; gap:6px; }
  .hud-pill.streak{ background:var(--orange); color:#2A0E5C; }

  .final-panel{ text-align:center; }
  .stars{ font-size:46px; margin:14px 0; letter-spacing:6px; }
  .final-score{ font-size:52px; font-family:'Baloo Bhaijaan 2'; color:var(--purple-deep); margin:6px 0; }
  .final-msg{ font-size:16px; color:#514774; margin-bottom:16px; }

  .nav-bar{ position:fixed; bottom:0; left:0; right:0; z-index:60; display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px; background:linear-gradient(0deg, rgba(13,6,32,.97), rgba(13,6,32,.7) 80%, transparent); }
  .nav-btn{ background:#fff; color:var(--purple-deep); border:none; font-family:'Baloo Bhaijaan 2'; font-weight:800; font-size:15px;
    padding:11px 22px; border-radius:999px; cursor:pointer; box-shadow:0 5px 0 #C9A6FF; display:flex; align-items:center; gap:6px; }
  .nav-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #C9A6FF; }
  .nav-btn:disabled{ opacity:.35; cursor:default; }
  .progress-wrap{ flex:1; margin:0 20px; }
  .progress-track{ height:10px; background:rgba(255,255,255,.14); border-radius:999px; overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--purple), var(--green)); border-radius:999px; transition:width .35s ease; }
  .progress-label{ color:#D9C6FF; font-size:12.5px; text-align:center; margin-top:6px; font-family:'Baloo Bhaijaan 2'; }
  .mascot-track{ position:fixed; bottom:64px; left:0; right:0; height:0; pointer-events:none; z-index:70; }
  .mascot{ position:absolute; font-size:28px; transition:left .5s cubic-bezier(.4,1.4,.6,1); }

  .flash-overlay{ position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; }
  .flash-overlay.on{ animation:flash .5s ease; }
  @keyframes flash{ 0%{opacity:0;} 20%{opacity:.35;} 100%{opacity:0;} }
  .confetti{ position:fixed; top:-20px; z-index:999; pointer-events:none; border-radius:2px; }

  .logo-corner{ position:fixed; top:16px; right:16px; z-index:80; display:flex; align-items:center; gap:8px; }
  .logo-corner img{ width:56px; height:auto; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .brand-tag{ color:#D9C6FF; font-size:11px; font-family:'Baloo Bhaijaan 2'; line-height:1.3; text-align:left; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#C9A6FF; border-radius:8px; }
</style>
</head>

    <div class="tip-row"><span class="dot">🚪</span> = للتخزين، == للمقارنة — لا تخلط بينهما أبداً!</div>
  `
},
{
  type:"quiz-intro",
  html:`
    <div class="cover-emoji">🎃👻🕸️</div>
    <div class="eyebrow quiz">تحدي الأشباح</div>
    <h2 class="slide-title" style="text-align:center;">هل تجرؤ على تحدي 20 سؤال مرعب... وممتع؟! 🏆</h2>
    <p class="lead" style="text-align:center;">كل باب يفتح بإجابة صحيحة! اقرأ الكود جيداً واختر الرمز أو الناتج الصحيح لتتقدم عبر غرف القصر.</p>
    <div style="text-align:center;"><button class="start-btn" onclick="goTo(current+1)">👻 ابدأ التحدي</button></div>
  `
}
];

</script>
<script>
const TOTAL_QUIZ = QUESTIONS.length;
let current = 0;
let score = 0;
let streak = 0;
let audioCtx = null;
const deck = document.getElementById('deck');
const QUIZ_START_INDEX = LESSON_SLIDES.length;
const FINAL_INDEX = QUIZ_START_INDEX + TOTAL_QUIZ;
const TOTAL_SLIDES = FINAL_INDEX + 1;

/* ============ twinkling stars ============ */
(function makeStars(){
  const holder = document.getElementById('stars-holder');
  for(let i=0;i<24;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = Math.random() > 0.5 ? '✦' : '✧';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (Math.random()*70)+'vh';
    s.style.fontSize = (8+Math.random()*10)+'px';
    s.style.animationDuration = (2+Math.random()*3)+'s';
    s.style.animationDelay = (Math.random()*3)+'s';
    holder.appendChild(s);
  }
})();

/* ============ audio ============ */
function getAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  return audioCtx;
}
function tone(freq, start, dur, type='sine', vol=0.18){
  const ctx = getAudioCtx();
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.start(t0); o.stop(t0+dur+0.02);
}
function playSpookyWhoosh(){
  try{
    const ctx = getAudioCtx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(700, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.35);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.09, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.38);
    o.start(); o.stop(ctx.currentTime+0.4);
  }catch(e){}
}
function playCorrect(){ try{ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f, i*0.09, 0.25,'sine',0.17)); }catch(e){} }
function playStreak(){ try{ [880,1174.66,1567.98,1975.5].forEach((f,i)=>tone(f, i*0.07, 0.22,'triangle',0.15)); }catch(e){} }
function playWrong(){
  try{
    const ctx = getAudioCtx();
    [220,160].forEach((f,i)=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sawtooth';
      const t0 = ctx.currentTime + i*0.28;
      o.frequency.setValueAtTime(f, t0);
      o.frequency.exponentialRampToValueAtTime(f*0.7, t0+0.26);
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.14, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.3);
      o.start(t0); o.stop(t0+0.32);
    });
  }catch(e){}
}
function playFanfare(){ try{ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f, i*0.12, 0.35,'sine',0.19)); }catch(e){} }

function flash(color){
  const el = document.getElementById('flash');
  el.style.background = color;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}

function launchConfetti(n=30){
  const colors = ['#9D4EDD','#39FF14','#FF7518','#FF3EA5','#FFD23F'];
  const shapes = ['👻','🎃','⭐','🦇'];
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    const useEmoji = Math.random() < 0.25;
    if(useEmoji){
      el.textContent = shapes[Math.floor(Math.random()*shapes.length)];
      el.style.fontSize = (14+Math.random()*10)+'px';
      el.style.background = 'transparent';
    } else {
      const size = 6+Math.random()*6;
      el.style.width = size+'px'; el.style.height=(size*1.4)+'px';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
    }
    el.style.left = (Math.random()*100)+'vw';
    document.body.appendChild(el);
    const dur = 1500+Math.random()*1200;
    el.animate([
      {transform:'translateY(0) rotate(0deg)', opacity:1},
      {transform:`translateY(${window.innerHeight+40}px) rotate(${Math.random()*360}deg)`, opacity:.9}
    ], {duration:dur, easing:'ease-in'});
    setTimeout(()=>el.remove(), dur+50);
  }
}

function moveMascot(pct){
  const m = document.getElementById('mascot');
  m.style.left = `calc(${pct}% - 15px)`;
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildSlideEl(index){
  const wrap = document.createElement('div');
  wrap.className = 'slide';
  wrap.id = 'slide-'+index;

  if(index < QUIZ_START_INDEX){
    const s = LESSON_SLIDES[index];
    const panel = document.createElement('div');
    panel.className = 'panel';
    if(s.type === 'cover' || s.type === 'quiz-intro'){
      panel.innerHTML = s.html;
    } else {
      panel.innerHTML = `<div class="eyebrow">${s.eyebrow}</div><h2 class="slide-title">${s.title}</h2>${s.html}`;
    }
    wrap.appendChild(panel);
  } else if(index < FINAL_INDEX){
    const qIdx = index - QUIZ_START_INDEX;
    const q = QUESTIONS[qIdx];
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `
      <div class="quiz-hud">
        <div class="hud-pill">🎯 السؤال ${qIdx+1} / ${TOTAL_QUIZ}</div>
        <div class="hud-pill">⭐ النقاط: <span id="hud-score">${score}</span></div>
        <div class="hud-pill streak" id="hud-streak-pill" style="${streak>=2 ? '' : 'display:none;'}">🔥 سلسلة: <span id="hud-streak">${streak}</span></div>
      </div>
      <h2 class="slide-title" style="text-align:center;">افتح الباب التالي بالإجابة الصحيحة! 🚪</h2>
      <div class="q-code">${escapeHtml(q.code)}</div>
      <div class="options" id="opts-${qIdx}">
        ${q.options.map((opt,i)=>`<button class="opt-btn" data-opt="${i}" onclick="answer(${qIdx}, ${i})">${escapeHtml(opt)}</button>`).join('')}
      </div>
      <div class="feedback" id="fb-${qIdx}"></div>
    `;
    wrap.appendChild(panel);
  } else {
    const panel = document.createElement('div');
    panel.className = 'panel final-panel';
    panel.id = 'final-panel';
    panel.innerHTML = `
      <div style="font-size:56px;">🏆</div>
      <h2 class="slide-title" id="final-title">جاري الحساب...</h2>
      <div class="stars" id="final-stars"></div>
      <div class="final-score"><span id="final-score">0</span> / ${TOTAL_QUIZ}</div>
      <p class="final-msg" id="final-msg"></p>
      <button class="start-btn" onclick="resetAll()">🔄 أعد اكتشاف القصر</button>
    `;
    wrap.appendChild(panel);
  }
  return wrap;
}

function ensureSlide(index){
  if(!document.getElementById('slide-'+index)){
    deck.appendChild(buildSlideEl(index));
  }
}

function goTo(index){
  if(index < 0 || index >= TOTAL_SLIDES) return;
  playSpookyWhoosh();
  document.querySelectorAll('.slide.active').forEach(s=>s.classList.remove('active'));
  ensureSlide(index);
  current = index;
  document.getElementById('slide-'+index).classList.add('active');
  updateNav();
  if(index === FINAL_INDEX){ showFinal(); }
}

function updateNav(){
  const pct = Math.round(((current+1)/TOTAL_SLIDES)*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `${current+1} / ${TOTAL_SLIDES}`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current >= TOTAL_SLIDES-1;
  moveMascot(pct);
}

function answer(qIdx, optIdx){
  const q = QUESTIONS[qIdx];
  const optsWrap = document.getElementById('opts-'+qIdx);
  if(optsWrap.dataset.answered === 'true') return;
  optsWrap.dataset.answered = 'true';

  const buttons = optsWrap.querySelectorAll('.opt-btn');
  buttons.forEach(b=>{
    b.disabled = true;
    const bi = parseInt(b.dataset.opt);
    if(bi === q.correct){ b.classList.add('correct'); }
    else if(bi === optIdx){ b.classList.add('wrong'); }
    else { b.classList.add('dim'); }
  });

  const fb = document.getElementById('fb-'+qIdx);
  fb.classList.add('show');

  if(optIdx === q.correct){
    score++;
    streak++;
    fb.classList.add('ok');
    fb.innerHTML = '🎉 <b>الباب مفتوح! إجابة صحيحة</b> — ' + q.explain;
    flash('#39FF14');
    launchConfetti(streak>=3 ? 45 : 24);
    if(streak >= 3){ playStreak(); } else { playCorrect(); }
  } else {
    streak = 0;
    fb.classList.add('bad');
    fb.innerHTML = '👻 <b>الباب مقفل! حاول في المرة القادمة</b> — ' + q.explain;
    flash('#FF3EA5');
    playWrong();
  }
  const hudScore = document.getElementById('hud-score');
  if(hudScore) hudScore.textContent = score;
  const streakPill = document.getElementById('hud-streak-pill');
  const hudStreak = document.getElementById('hud-streak');
  if(streakPill && hudStreak){
    hudStreak.textContent = streak;
    streakPill.style.display = streak >= 2 ? 'flex' : 'none';
  }
}

function showFinal(){
  const pct = score / TOTAL_QUIZ;
  let stars = '⭐️';
  if(pct >= 0.85) stars = '⭐️⭐️⭐️';
  else if(pct >= 0.5) stars = '⭐️⭐️';
  document.getElementById('final-stars').textContent = stars;
  document.getElementById('final-score').textContent = score;

  let title, msg;
  if(pct === 1){ title='سيّد القصر المسكون! 🏆👻'; msg='علامة كاملة! لم يعد هناك أي غرفة أو رمز يخيفك بعد الآن، أنت خبير رموز بايثون!'; }
  else if(pct >= 0.7){ title='أنت شجاع جداً! 🌟'; msg='فتحت معظم الأبواب بنجاح! راجع الأسئلة الصعبة وستُتقن كل الرموز تماماً.'; }
  else if(pct >= 0.4){ title='بداية جيدة أيها الشجاع! 💪'; msg='بعض الأشباح خدعتك قليلاً! راجع غرف القصر مرة أخرى وحاول من جديد.'; }
  else { title='لا بأس، القصر بانتظارك مجدداً! 🌱'; msg='ارجع لجولة القصر لمراجعة كل الرموز، ثم عد للتحدي — ستفتح كل الأبواب في المرة القادمة!'; }
  document.getElementById('final-title').textContent = title;
  document.getElementById('final-msg').textContent = msg;
  playFanfare();
  launchConfetti(70);
}

function resetAll(){
  score = 0; streak = 0;
  for(let i=QUIZ_START_INDEX;i<TOTAL_SLIDES;i++){
    const el = document.getElementById('slide-'+i);
    if(el) el.remove();
  }
  goTo(0);
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goTo(current-1);
  if(e.key === 'ArrowLeft') goTo(current+1);
});

goTo(0);

</script>
</body>
</html>
